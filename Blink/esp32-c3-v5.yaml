# Board: Generic ESP32-C3 Board (Generic)
# Definition: definitions/boards/generic-esp32c3/manifest.yaml
esphome:
  name: esp32-c3-v3
  friendly_name: esp32-c3-v3

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret QMB_api

ota:
  - platform: esphome
    password: !secret QMB_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: esp32-c3_v2 Fallback Hotspot
    password: "jHpjQvbr2Fcu"

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device.
captive_portal:

##########################################################################
number:
  - platform: template
    id: blink_speed
    name: "Blink Interval"
    optimistic: true
    restore_value: true
    min_value: 100
    max_value: 5000
    step: 100
    unit_of_measurement: "ms"
    
output:
  - platform: gpio
    pin:
      number: 3
      mode: output
    id: greenLED
  - platform: gpio
    pin:
      number: 2
      mode: output
    id: oranjeLED



interval:
  - interval: 2000ms
    then:
      - output.turn_on: oranjeLED
      - output.turn_off: greenLED
      - delay: !lambda "return id(blink_speed).state;"
      - output.turn_off: oranjeLED
      - output.turn_on: greenLED
